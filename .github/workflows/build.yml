name: Build Project
on:
    push:
        branches: ["stripe-api-integration", "dev", "master"]
    pull_request:
        branches: ["master"]
jobs:
    quality_check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Biome for check
              uses: biomejs/setup-biome@v2
              with:
                version: latest
            - name: Run Biome
              run: biome ci .
    test:
        runs-on: ubuntu-latest
    
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: Use the latest stable Node.js
              uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'
                cache: "npm"
            - name: Setup docker compose
              run : sudo apt-get install -y docker-compose
            - name: Set environment variables
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
                TEST_DB_URL: ${{ secrets.TEST_DB_URL}}
                DB_USER: ${{ secrets.DB_USER }}
                DB_PASSWORD: ${{ secrets.DB_PASSWORD}}
                STRIPE_API_URL: ${{ secrets.STRIPE_API_URL }}
                STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY}}
              run: |
                echo JWT_SECRET=$JWT_SECRET
                echo GITHUB_TOKEN=$GITHUB_TOKEN
                echo JWT_SECRET=$JWT_SECRET >> .env
                echo TEST_DB_URL=$TEST_DB_URL >> .env
                echo DB_USER=$DB_USER >> .env
                echo DB_PASSWORD=$DB_PASSWORD >> .env
                echo STRIPE_API_URL=$STRIPE_API_URL >> .env
                echo STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY >> .env
            - name: Build and start app
              run: docker-compose --env-file .env -f docker-compose.yml up -d --build
            - name: Wait for test database to be ready
              run: |
                retries=5
                count=0
                until docker exec mongo_db_community sh -c 'mongosh --eval "db.runCommand({ ping: 1 })"' || [ $count -ge $retries ]; do
                  echo "Waiting for test_db to be ready...Attempt $((count + 1))/$retries"
                  sleep 5
                  count=$((count + 1))
                done
                if [ $count -ge $retries ]; then
                  echo "The test db did not start in time, exiting..."
                  exit 1
                fi
                echo "Connection test successful"
            - name: Run Tests
              run: docker exec express-ts-app npm run test
            - name: Tear down services
              run: docker-compose down
