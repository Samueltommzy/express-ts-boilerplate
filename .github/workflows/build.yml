name: Build Project

on:
    push:
        branches: ["dev", "master"]
    pull_request:
        branches: ["master"]
jobs:
    quality_check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Biome for check
              uses: biomejs/setup-biome@v2
              with:
                version: latest
            - name: Run Biome
              run: biome ci .
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use the latest stable Node.js
              uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'
                cache: "npm"
            - name: Clean Install Dependencies
              run: npm ci
            - name: Set environment variable
              run: |
                echo "JWT_SECRET=testSecret" >> .env
            - name: Run Test
              run: npm run test
