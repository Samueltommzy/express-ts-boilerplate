name: Build Project
on:
    push:
        branches: ["diagnosis", "dev", "master"]
    pull_request:
        branches: ["master"]
jobs:
    quality_check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Biome for check
              uses: biomejs/setup-biome@v2
              with:
                version: latest
            - name: Run Biome
              run: biome ci .
    test:
        runs-on: ubuntu-latest
    
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: Use the latest stable Node.js
              uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'
                cache: "npm"
            - name: Setup docker compose
              run : sudo apt-get install -y docker-compose
            - name: Set environment variables
              run: |
                echo "JWT_SECRET=testSecret" >> .env
                echo "DB_URL=mongodb://database:27017/dev" >> .env
                echo "TEST_DB_URL=mongodb://database:27017/test" >> .env
            - name: Build and start app
              run: docker-compose --env-file .env -f docker-compose.yml up -d --build
            - name: Wait for test database to be ready
              run: docker exec express-ts-app npm run mongo-connect
            # - name: Check that app is ready
            #   run: docker exec express-ts-app sh -c 'until curl -s http://localhost:3000/health; do sleep 1; done'
            # - name: Install dependencies
            #   run: docker exec express-ts-app npm ci
            - name: Run Tests
              run: docker exec express-ts-app npm run test
            - name: Tear down services
              run: docker-compose down
