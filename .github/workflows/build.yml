name: Build Project
on:
    push:
        branches: ["diagnosis", "dev", "master"]
    pull_request:
        branches: ["master"]
jobs:
    quality_check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Biome for check
              uses: biomejs/setup-biome@v2
              with:
                version: latest
            - name: Run Biome
              run: biome ci .
    test:
        runs-on: ubuntu-latest
    
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: Use the latest stable Node.js
              uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'
                cache: "npm"
            - name: Clean Install Dependencies
              run: npm ci
            - name: Setup docker compose
              run : sudo apt-get install -y docker-compose
            - name: Set environment variables
              run: |
                echo "JWT_SECRET=testSecret" >> .env
                echo "DB_URL=mongodb://database:27017/dev" >> .env
                echo "TEST_DB_URL=mongodb://localhost:27017/test" >> .env
            - name: Build and start app
              run: docker-compose --env-file .env -f docker-compose.yml up -d
            - name: Wait for test database to be ready
              run: |
                retries=5
                count=0
                until docker exec mongo_db_community mongosh mongodb://database:27017/dev --quiet|| [ $count -ge $retries ]; do
                  echo "Waiting for test_db to be ready...Attempt $((count + 1))/$retries"
                  sleep 5
                  count=$((count + 1))
                done
                if [ $count -ge $retries ]; then
                  echo "The test db did not start in time, exiting..."
                  exit 1
                echo "Connection test successful"
                fi
            - name: Start mongodb service
              uses: supercharge/mongodb-github-action@1.12.0
              with:
                mongodb-container-name: mongo_db_community_v2
                mongodb-image: mongodb/mongodb-community-server
            - name: Run Test
              run: npm run test
            - name: Tear down services
              run: docker-compose down
