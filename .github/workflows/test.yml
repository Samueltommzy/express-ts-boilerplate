name: Test

on:
    push:
        branches: ["dev", "master"]
    pull_request:
        branches: ["master"]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use the latest stable Node.js
              uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'
                cache: "npm"
            - name: Clean Install Dependencies
              run: npm ci
            - name: Run Test
              run: npm run test
